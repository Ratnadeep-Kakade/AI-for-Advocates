[project]
name = "cicero-api"
version = "0.4.0"
description = "Cicero legal AI HTTP API service and Modal execution host"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cicero",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "modal>=1.6,<2.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cicero_api"]
