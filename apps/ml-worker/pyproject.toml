[project]
name = "cicero-ml-worker"
version = "0.4.0"
description = "Cicero legal AI GPU worker: Docling parsing, BGE-M3 embeddings and reranker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "modal>=1.6,<2.0",
    "torch>=2.2.0",
    "sentence-transformers>=3.0.0",
    "docling>=2.0.0",
    "transformers>=4.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cicero_ml"]
