[project]
name = "cicero-backend"
version = "0.1.0"
description = "Backend foundation for the Cicero legal AI platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "modal>=1.6,<2.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cicero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
