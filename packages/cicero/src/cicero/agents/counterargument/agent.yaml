id: counterargument
agent_id: counterargument
name: Counterargument Agent
version: "1.0"
description: >
  Adversarially attacks the argument output, finding weaknesses, counterarguments,
  and alternative interpretations using case intelligence and research findings.
  Runs on DeepSeek-R1 / Llama 3 70B.
capabilities:
  - Construct counterarguments
  - Identify legal vulnerabilities
  - Surface affirmative defenses
model_role: counterargument
execution_strategy: single_shot
limits:
  max_turns: 1
  token_budget: 32000
  timeout_s: 180
requested_tools:
  - retrieve_case_evidence
skills:
  - authority_classification
verification:
  - citation_exists
  - quote_matches_source
tools:
  - retrieve_case_evidence
inputs:
  - case_id
  - case_intelligence_reference
  - research_findings_reference
  - argument_output_reference
outputs:
  - counterargument_output
can_run_in_parallel: true
