id: evaluator
agent_id: evaluator
name: Evaluator
version: "1.0"
description: >
  Evaluates argument and counterargument outputs against the VerificationReport
  emitted by deterministic Python checks (quote matches, citation checks, evidence
  resolution) and judges the substantive legal strength, sufficiency, and coherence.
capabilities:
  - Evaluate evidentiary sufficiency
  - Assess legal authority strength
  - Judge argument coherence
model_role: evaluator
execution_strategy: single_shot
limits:
  max_turns: 1
  token_budget: 32000
  timeout_s: 180
requested_tools:
  - retrieve_case_evidence
  - verify_citations
skills:
  - authority_classification
verification:
  - citation_exists
  - quote_matches_source
tools:
  - retrieve_case_evidence
  - verify_citations
inputs:
  - case_id
  - verification_report
  - argument_output_reference
  - counterargument_output_reference
outputs:
  - evaluation
can_run_in_parallel: false
