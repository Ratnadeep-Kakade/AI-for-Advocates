[project]
name = "cicero"
version = "0.4.0"
description = "Cicero legal AI core library: domain models, harness, RAG protocols, and agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "cloud-sql-python-connector[asyncpg]>=1.18,<2.0",
    "google-auth>=2.35,<3.0",
    "google-cloud-storage>=3.0,<4.0",
    "httpx>=0.27,<1.0",
    "pgvector>=0.3,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pyyaml>=6.0,<7.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "import-linter>=2.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cicero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest_tmp"
asyncio_mode = "auto"
