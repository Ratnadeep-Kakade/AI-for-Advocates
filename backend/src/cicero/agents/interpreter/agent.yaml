agent_id: interpreter
name: Request Interpreter
version: "1.0"
description: >
  Converts a raw user legal request into a validated Task Specification using
  the Platform Capability Registry. Never performs specialist analysis itself.
capabilities:
  - Understand user legal requests
  - Identify required specialist capabilities
  - Produce structured task specifications
  - Request clarification when information is missing
model_role: interpreter
tools: []
inputs:
  - case_id
  - user_request
outputs:
  - task_specification
can_run_in_parallel: false
