agent_id: counterargument
name: Counterargument Agent
version: "1.0"
description: >
  Independently analyses the same evidence from opposing counsel's perspective,
  then challenges the Argument Agent's output in a second pass. Searches for
  contradictory facts, unfavourable authorities, alternative interpretations,
  procedural weaknesses and missing evidence. Runs on
  DeepSeek-R1-Distill-Llama-70B in a separate execution context.
capabilities:
  - Construct opposing legal arguments
  - Challenge proposed arguments
  - Identify contradictory evidence
  - Identify adverse authorities
model_role: counterargument
tools:
  - retrieve_case_evidence
inputs:
  - case_id
  - case_intelligence_reference
  - research_findings_reference
  - argument_output_reference
outputs:
  - counterargument_output
can_run_in_parallel: true
