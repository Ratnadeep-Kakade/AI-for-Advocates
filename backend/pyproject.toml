[project]
name = "cicero-backend"
version = "0.3.0"
description = "Cicero legal AI backend: model gateway, Cloud SQL and private document storage"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "cloud-sql-python-connector[asyncpg]>=1.18,<2.0",
    "fastapi>=0.115,<1.0",
    "google-auth>=2.35,<3.0",
    "google-cloud-storage>=3.0,<4.0",
    "google-cloud-pubsub>=2.25,<3.0",
    "httpx>=0.27,<1.0",
    "pgvector>=0.3,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "pyyaml>=6.0,<7.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
]

[dependency-groups]
dev = [
    "modal>=1.6,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.8,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cicero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/cicero/rag/argon"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
